<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Hello World App</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      gap: 1.5rem;
    }
    button {
      font-size: 1.2rem;
      padding: 0.75rem 1.5rem;
      cursor: pointer;
    }
    #output {
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <button onclick="document.getElementById('output').textContent = 'Hello World'">Click me</button>
  <div id="output"></div>
</body>
</html>
